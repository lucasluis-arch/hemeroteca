name: Chequeo matutino del Heraldo

on:
  # El disparador "schedule" nativo de GitHub no tiene horario garantizado y
  # puede demorarse horas, así que este workflow se dispara desde afuera
  # (un cron externo que llama a la API de GitHub) en vez de usar schedule.
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Revisar el día de hoy y enviar el correo
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
          PAGES_URL: ${{ secrets.PAGES_URL }}
        run: node .github/scripts/check-today.mjs
