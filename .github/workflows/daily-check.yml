name: Chequeo matutino del Heraldo

on:
  schedule:
    # 06:17 UTC = 03:17 hora Uruguay (UTC-3 fijo, sin horario de verano).
    # Horario de madrugada y minuto suelto a propósito: fuera de los horarios
    # "en punto" más pedidos de GitHub, donde a veces se saltea la ejecución.
    - cron: '17 6 * * *'
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Revisar el día de hoy y enviar el correo
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
          PAGES_URL: ${{ secrets.PAGES_URL }}
        run: node .github/scripts/check-today.mjs
