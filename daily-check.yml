name: Chequeo matutino del Heraldo

on:
  schedule:
    # 11:00 UTC = 08:00 hora Uruguay (UTC-3 fijo, sin horario de verano).
    - cron: '0 11 * * *'
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Revisar el día de hoy y enviar el correo
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
          PAGES_URL: ${{ secrets.PAGES_URL }}
        run: node .github/scripts/check-today.mjs
